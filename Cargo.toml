[package]
name = "winpanes"
version = "0.1.0"
edition = "2021"
description = "Dock any window into terminal-style panes — a lightweight window-tiling tool for Windows"
license = "MIT"
repository = "https://github.com/abe326/winpanes"
readme = "README.md"
keywords = ["windows", "tiling", "window-manager", "pane", "dock"]
categories = ["gui", "os::windows-apis"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
